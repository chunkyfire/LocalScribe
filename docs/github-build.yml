# Baut die Windows-Version aus dem öffentlichen Quelltext. Bei einem Versions-Tag (v…) wird daraus
# ein Release mit Prüfsumme und Herkunftsnachweis: Jeder kann nachprüfen, dass die ZIP-Datei von
# GitHub aus genau diesem Stand des Quelltexts gebaut wurde.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Schnelle Tests
        shell: pwsh
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv\Scripts\python.exe -r requirements.txt
          .venv\Scripts\python.exe tests\test_hotkey.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe tests\test_llm.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Bauen
        shell: pwsh
        run: ./build.ps1
      - name: Prüfsumme
        shell: pwsh
        run: |
          Get-ChildItem dist\*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LocalScribe-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem dist\*.zip).FullName
          gh release create $env:GITHUB_REF_NAME $zip dist\SHA256SUMS.txt --title "LocalScribe $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes-file RELEASE_NOTES.md
